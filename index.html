<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angielski - Gry Edukacyjne</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0fdf4;
            color: #1f2937;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #166534;
            margin-bottom: 10px;
        }
        p {
            color: #6b7280;
            margin-bottom: 30px;
        }
        .menu-btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin: 15px 0;
            background-color: #22c55e;
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(34, 197, 94, 0.2);
        }
        .menu-btn:hover {
            background-color: #16a34a;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(34, 197, 94, 0.3);
        }
        .menu-btn.business {
            background-color: #3b82f6;
            box-shadow: 0 4px 6px rgba(59, 130, 246, 0.2);
        }
        .menu-btn.business:hover {
            background-color: #2563eb;
            box-shadow: 0 6px 12px rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Wybierz grę! 🎮</h1>
        <p>Wybierz zestaw słówek, który chcesz dzisiaj poćwiczyć.</p>
        
        <a href="memory.html" class="menu-btn">
            🧠 Memory: Człowiek i Emocje
        </a>
        
        <a href="quiz.html" class="menu-btn business">
            💼 Quiz: Business English
        </a>
    </div>

</body>
</html>
